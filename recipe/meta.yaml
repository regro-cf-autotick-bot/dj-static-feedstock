{% set name = "dj-static" %}
{% set version = "0.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/dj-static-{{ version }}.tar.gz
  sha256: 032ec1c532617922e6e3e956d504a6fb1acce4fc1c7c94612d0fda21828ce8ef

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 3

requirements:
    host:
        - python {{ python_min }}
        - setuptools
        - pip
        - static
    run:
        - python >={{ python_min }}
        - static

test:
    requires:
        - django
        - python {{ python_min }}
    commands:
        - python -c "import django; from django.conf import settings; settings.configure(); django.setup(); import dj_static"

about:
    home: https://github.com/kennethreitz/dj-static
    license: BSD-2-Clause
    license_family: BSD
    summary: 'Serve production static files with Django.'

extra:
    recipe-maintainers:
        - kwilcox
        - xmnlab
